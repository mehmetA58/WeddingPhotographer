openapi: 3.0.3
info:
  title: EventPhoto API
  version: 2.0.0
  description: |
    EventPhoto backend contract — Cloudflare Pages Functions, served same-origin
    under `/api`. Uploads send raw image bytes; responses are real JSON (no CORS
    workarounds). Each event is identified by an unguessable `e` (eventId) baked
    into the guest QR. Gallery/slideshow listing additionally requires the host
    key `k` (adminKey), which is never shared with guests.

    OAuth uses the server-side authorization-code flow with only the
    non-sensitive `drive.file` scope, so no Google app verification is required.
servers:
  - url: '{origin}/api'
    description: Site origin (e.g. https://eventphoto.pages.dev)
    variables:
      origin:
        default: https://eventphoto.pages.dev
tags:
  - name: Health
  - name: OAuth
  - name: Upload
  - name: Gallery
  - name: Notes

paths:
  /ping:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  service: { type: string, example: eventphoto-api }

  /oauth/start:
    get:
      tags: [OAuth]
      summary: Begin host Google OAuth
      description: Stores a short-lived state + event context in KV and 302-redirects to Google's consent screen.
      parameters:
        - name: title
          in: query
          schema: { type: string }
          description: Event title (used for the Drive folder name)
        - name: event
          in: query
          schema: { type: string }
          description: Event type key (e.g. wedding)
      responses:
        '302': { description: Redirect to Google consent }
        '500': { description: Missing server configuration }

  /oauth/callback:
    get:
      tags: [OAuth]
      summary: Google OAuth return
      description: |
        Exchanges the authorization code for tokens, creates the Drive folder,
        stores the event in KV, and 302-redirects back to
        `setup.html?e=<eventId>&k=<adminKey>` (or `setup.html?err=<code>`).
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        '302': { description: Redirect back to setup.html }

  /upload:
    post:
      tags: [Upload]
      summary: Upload one photo
      description: |
        Request body is the raw (optionally client-resized) image bytes.
        Metadata travels in query parameters. Idempotent on `uploadId`.
      parameters:
        - name: e
          in: query
          required: true
          schema: { type: string }
          description: eventId
        - name: guestName
          in: query
          required: true
          schema: { type: string, maxLength: 40 }
        - name: task
          in: query
          schema: { type: string, maxLength: 80 }
        - name: uploadId
          in: query
          schema: { type: string, maxLength: 80 }
          description: Client-generated id for dedupe / retry safety
        - name: filename
          in: query
          schema: { type: string }
        - name: mimeType
          in: query
          schema: { type: string, example: image/jpeg }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded (or duplicate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }

  /list:
    get:
      tags: [Gallery]
      summary: List photos (and notes) for the host
      parameters:
        - name: e
          in: query
          required: true
          schema: { type: string }
          description: eventId
        - name: k
          in: query
          required: true
          schema: { type: string }
          description: adminKey (host key)
        - name: notes
          in: query
          schema: { type: string, enum: ['1'] }
          description: Include guest-book notes
        - name: max
          in: query
          schema: { type: integer, default: 500, maximum: 1000 }
      responses:
        '200':
          description: Gallery list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /note:
    post:
      tags: [Notes]
      summary: Save a guest-book note
      description: Appends the note to KV (live feed) and writes a `Not_*.txt` keepsake to Drive.
      parameters:
        - name: e
          in: query
          required: true
          schema: { type: string }
          description: eventId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestName, message]
              properties:
                guestName: { type: string, maxLength: 40 }
                message: { type: string, maxLength: 500 }
                noteId: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Saved (or duplicate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        code: { type: string, example: invalid_token }
        message: { type: string }
    FileMeta:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        t: { type: integer, description: Created-time epoch ms }
        createdAt: { type: string, format: date-time }
        size: { type: integer }
        d:
          type: string
          description: 'Caption source: "EventPhoto · Katılımcı: X · Görev: Y · UploadId: Z"'
    Note:
      type: object
      properties:
        id: { type: string }
        g: { type: string, description: Guest name }
        m: { type: string, description: Note text }
        t: { type: integer, description: Epoch ms }
    UploadResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        duplicate: { type: boolean }
        uploadId: { type: string }
        fileId: { type: string }
        name: { type: string }
    ListResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        count: { type: integer }
        folderId: { type: string }
        folderUrl: { type: string }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileMeta' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
    NoteResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        type: { type: string, example: note }
        noteId: { type: string }
        duplicate: { type: boolean }
        savedProperties: { type: boolean }
        savedDrive: { type: boolean }
        fileId: { type: string }
